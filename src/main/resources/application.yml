server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_ADDRESS:localhost:3306}/${MYSQL_DATABASE:couple_app}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:${DB_PASSWORD:Wp18379879163}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:

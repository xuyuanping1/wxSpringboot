version: '3.8'

services:
  couple-springboot:
    build: .
    container_name: couple-springboot
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-server:3306/couple_app?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=your_db_password
      - SERVER_PORT=8080
      - TZ=Asia/Shanghai
      - JAVA_OPTS=-Duser.timezone=Asia/Shanghai
      # 密钥配置（通过环境变量注入，覆盖 application.yml 默认值）
      - DB_PASSWORD=your_db_password
      - WECHAT_SECRET=your_wechat_secret
      - OSS_ACCESS_KEY_ID=your_oss_key_id
      - OSS_ACCESS_KEY_SECRET=your_oss_key_secret
    volumes:
      - ./files:/app/files
      - /etc/localtime:/etc/localtime:ro
    networks:
      - myapp_default
    restart: always

networks:
  myapp_default:
    external: true
